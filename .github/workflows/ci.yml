name: CI — Enterprise COVID-19 Analytics Platform

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  POSTGRES_DB: covid19_test
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password_ci
  DATABASE_URL: postgresql://test_user:test_password_ci@localhost:5432/covid19_test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # BACKEND — Lint, Type Check, Unit Tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        working-directory: backend
        run: ruff format --check .

      - name: Run MyPy type checker
        working-directory: backend
        run: mypy app/ --ignore-missing-imports

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ci_secret_key_not_for_production
          JWT_SECRET_KEY: ci_jwt_secret_key_not_for_production
        run: alembic upgrade head

      - name: Run unit tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ci_secret_key_not_for_production
          JWT_SECRET_KEY: ci_jwt_secret_key_not_for_production
          APP_ENV: testing
        run: |
          pytest tests/unit/ \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -x

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ci_secret_key_not_for_production
          JWT_SECRET_KEY: ci_jwt_secret_key_not_for_production
          APP_ENV: testing
        run: pytest tests/integration/ -v -x

      - name: Run API tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ci_secret_key_not_for_production
          JWT_SECRET_KEY: ci_jwt_secret_key_not_for_production
          APP_ENV: testing
        run: pytest tests/api/ -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ─────────────────────────────────────────────────────────────────────────
  # FRONTEND — Lint, Type Check, Tests, Build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node.js dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --run --reporter=verbose

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_NAME: "COVID-19 Analytics Platform"
          VITE_APP_ENV: production
          VITE_POWERBI_CLIENT_ID: placeholder
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # ETL PIPELINE TESTS
  # ─────────────────────────────────────────────────────────────────────────
  etl-tests:
    name: ETL Pipeline Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ETL tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ci_secret_key_not_for_production
          APP_ENV: testing
        run: pytest tests/etl/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────
  # DOCKER BUILD VALIDATION
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          target: production
          push: false
          tags: covid19-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: docker/frontend/Dockerfile
          target: production
          push: false
          tags: covid19-frontend:ci
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_NAME=COVID-19 Analytics Platform
            VITE_APP_ENV=production
            VITE_POWERBI_CLIENT_ID=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # SECURITY SCAN
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Run Bandit Python security linter
        run: |
          pip install bandit
          bandit -r backend/app/ -ll --format json -o bandit-report.json || true
          cat bandit-report.json

  # ─────────────────────────────────────────────────────────────────────────
  # STATUS — Summary gate for branch protection
  # ─────────────────────────────────────────────────────────────────────────
  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, etl-tests, docker-build, security-scan]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.etl-tests.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI checks passed ✔"
