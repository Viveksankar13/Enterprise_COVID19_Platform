version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: covid19_postgres
    restart: always
    environment:
      POSTGRES_USER: covid_admin
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_DB: covid19_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d/schemas
      - ./database/views:/docker-entrypoint-initdb.d/views
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - covid19_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covid_admin -d covid19_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Rate Limiter ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: covid19_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - covid19_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend API ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: covid19_backend
    restart: always
    environment:
      - APP_ENV=development
      - DEBUG=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=covid_admin
      - POSTGRES_PASSWORD=change_me_strong_password
      - POSTGRES_DB=covid19_analytics
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=DEVELOPMENT_SECRET_KEY_PLACEHOLDER_CHANGE_ME_IN_PRODUCTION_MIN_64_CHARS
      - JWT_SECRET_KEY=DEVELOPMENT_JWT_SECRET_KEY_PLACEHOLDER_CHANGE_ME_MIN_32_CHARS
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./etl:/app/etl
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - covid19_network

  # ── React Vite Frontend SPA ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: development
    container_name: covid19_frontend
    restart: always
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - covid19_network

  # ── Apache Airflow Webserver ────────────────────────────────────────────────
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: covid19_airflow_webserver
    restart: always
    environment:
      - LOAD_EXAMPLES=n
      - EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=covid_admin
      - POSTGRES_PASSWORD=change_me_strong_password
      - POSTGRES_DB=covid19_analytics
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./etl:/opt/airflow/etl
      - ./airflow/airflow.db:/opt/airflow/airflow.db
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Airflow --lastname Admin --role Admin --email admin@covidanalytics.local &&
               airflow webserver"
    networks:
      - covid19_network

  # ── Apache Airflow Scheduler ────────────────────────────────────────────────
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: covid19_airflow_scheduler
    restart: always
    environment:
      - LOAD_EXAMPLES=n
      - EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=covid_admin
      - POSTGRES_PASSWORD=change_me_strong_password
      - POSTGRES_DB=covid19_analytics
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./etl:/opt/airflow/etl
      - ./airflow/airflow.db:/opt/airflow/airflow.db
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    entrypoint: airflow scheduler
    networks:
      - covid19_network

networks:
  covid19_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
